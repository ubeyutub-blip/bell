<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="50%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="bellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.5" flood-color="#000"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2"/>
  <g filter="url(#shadow)">
    <!-- Top hanger -->
    <path d="M256 90 C236 90 220 106 220 126 L292 126 C292 106 276 90 256 90 Z" fill="#ca8a04"/>
    <circle cx="256" cy="100" r="12" fill="#fef08a"/>
    <!-- Bell Body -->
    <path d="M256 120 C180 120 150 220 130 310 C120 350 100 370 100 370 L412 370 C412 370 392 350 382 310 C362 220 332 120 256 120 Z" fill="url(#bellGrad)"/>
    <!-- Bell Rim -->
    <rect x="90" y="365" width="332" height="30" rx="15" fill="#fef08a"/>
    <!-- Bell Clapper -->
    <circle cx="256" cy="415" r="32" fill="#ca8a04"/>
    <circle cx="256" cy="415" r="24" fill="#fef08a"/>
    <!-- Acoustic Sound Waves -->
    <path d="M70 200 C50 230 50 280 70 310" fill="none" stroke="#fef08a" stroke-width="12" stroke-linecap="round"/>
    <path d="M442 200 C462 230 462 280 442 310" fill="none" stroke="#fef08a" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>
